# application.properties — ALL secrets come from environment variables; none are committed.
server.port=${PORT:8080}
spring.main.banner-mode=off

# Browser origins allowed to call this API (comma separated)
sheguard.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000}
# Public base URL of THIS backend (Twilio posts delivery receipts here; must be https in production)
sheguard.public-base-url=${PUBLIC_BASE_URL:}

# Firebase Admin credentials: path to a service-account JSON, or leave unset to use Application Default Credentials
sheguard.firebase.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}
sheguard.firebase.project-id=${FIREBASE_PROJECT_ID:}

# One-off admin grant: start once with GRANT_ADMIN_EMAIL=person@example.com, then stop and unset it.
sheguard.grant-admin-email=${GRANT_ADMIN_EMAIL:}

# Server-side Routes API key (only for routesMode="proxy"). Restrict it by IP + API in Google Cloud.
sheguard.routes.api-key=${GOOGLE_ROUTES_API_KEY:}

# Twilio SMS (leave empty → alerts are reported as "not_configured", never as sent)
sheguard.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sheguard.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sheguard.twilio.from=${TWILIO_FROM_NUMBER:}

# data.gov.in (Open Government Data Platform India). Needs a free registered API key and a resource id
# of a dataset that HAS an API (many catalogue entries do not — see README).
sheguard.datagovin.api-key=${DATAGOVIN_API_KEY:}
sheguard.datagovin.resource-id=${DATAGOVIN_RESOURCE_ID:}
sheguard.datagovin.catalog-url=${DATAGOVIN_CATALOG_URL:}
sheguard.datagovin.dataset-name=${DATAGOVIN_DATASET_NAME:data.gov.in dataset (configure name)}
sheguard.datagovin.coverage-description=${DATAGOVIN_COVERAGE:As published by the dataset (state/district level)}
sheguard.datagovin.geographic-precision=${DATAGOVIN_PRECISION:state}
# Names of the columns in YOUR chosen resource (they differ per dataset: see /resource/{id}?format=json&limit=1)
sheguard.datagovin.field-area=${DATAGOVIN_FIELD_AREA:state_ut}
sheguard.datagovin.field-category=${DATAGOVIN_FIELD_CATEGORY:crime_head}
sheguard.datagovin.field-period=${DATAGOVIN_FIELD_PERIOD:year}
sheguard.datagovin.field-count=${DATAGOVIN_FIELD_COUNT:cases}

# Scheduled refresh is OFF unless you confirm the source's terms allow automated refresh.
sheguard.safety.scheduled-refresh=${SAFETY_SCHEDULED_REFRESH:false}
sheguard.safety.refresh-cron=${SAFETY_REFRESH_CRON:0 0 3 1 * *}
